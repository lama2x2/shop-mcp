version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - errcheck
    - gosec
    - revive
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - gocritic
    - misspell
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/lama2x2/shop-mcp
